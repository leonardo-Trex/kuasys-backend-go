version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations/schema.sql"
    queries: "db/queries/"
    gen:
      go:
        package: "db"
        out: "internal/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "snake"
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

          - db_type: "timestamptz"
            go_type: "time.Time"

          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "Text"
            go_type: "string"
