version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/migrations/schema.sql"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "snake"     # opcional (padrão é snake)
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          
          - db_type: "timestamptz"
            go_type: "time.Time"

          - db_type: "timestamp"
            go_type: "time.Time"